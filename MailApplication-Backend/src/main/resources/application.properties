
# ==========================================
# MAIL SERVER (Port 8080)
# Pure Mail Operations + Internal API
# ==========================================

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080
server.address=0.0.0.0
spring.application.name=BTC Tech Mail Server

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/mail_app_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=mailuser
spring.datasource.password=MailUser@2026Secure
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# JPA SETTINGS
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# INTERNAL API SECURITY
# ==========================================
internal.api.key=BtcTechMailInternalAPI2026SecureKeyChangeInProduction
internal.api.enabled=true
internal.api.trusted-ips=127.0.0.1,localhost,::1,187.124.99.241

# ==========================================
# ENCRYPTION & JWT
# ==========================================
encryption.key=BtcTech2026Key16
encryption.algorithm=AES

jwt.secret=BtcTechMailServer2026SecretKeyForJWTAuthenticationVeryLongAndSecureMinimum256Bits
jwt.expiration=86400000

# ==========================================
# MAIL DOMAIN & STORAGE
# ==========================================
mail.domain=btctech.shop
mail.default-domain=btctech.shop
mail.storage.base-path=/var/mail/vmail
mail.base-path=/var/mail/vmail

# ==========================================
# AUTH SERVER CONNECTION
# ==========================================
auth.server.url=http://localhost:8081
auth.server.internal-key=BtcTechMailInternalAPI2026SecureKeyChangeInProduction

# ==========================================
# SMTP CONFIGURATION (Postfix)
# ==========================================
spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=pradeep@btctech.shop
spring.mail.password=Pradeep@1
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.connectiontimeout=10000

mail.smtp.host=localhost
mail.smtp.port=587

# ==========================================
# IMAP CONFIGURATION (Dovecot)
# ==========================================
mail.imap.host=localhost
mail.imap.port=993
mail.imap.protocol=imaps
mail.imap.ssl.enable=true

mail.dovecot.host=localhost
mail.dovecot.port=993

# ==========================================
# CORS CONFIGURATION
# ==========================================
cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://localhost:8081,http://mail.btctech.shop,http://accounts.btctech.shop,http://187.124.99.241:8080,http://187.124.99.241:8081
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true

# ==========================================
# LOGGING
# ==========================================
logging.level.root=INFO
logging.level.com.btctech.mailapp=DEBUG
logging.level.com.btctech.mailapp.controller.InternalMailboxController=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

logging.file.name=/opt/mailapp/logs/application.log

# ==========================================
# ERROR HANDLING
# ==========================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ==========================================
# ACTUATOR (HEALTH CHECKS)
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.server.port=8090
